<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Health Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js" defer></script>
</head>

<body>

  <h1>Health Dashboard</h1>

  <!-- 今日の体重 -->
  <div class="card">
    <h2>今日の体重</h2>
    <p id="latestWeight">-- kg</p>
    <p id="latestBMI">BMI: --</p>
    <button onclick="location.href='weight.html'">体重を入力する</button>
  </div>

  <!-- 今日の食事 -->
  <div class="card">
    <h2>今日の食事</h2>
    <p id="todayCalorie">合計: -- kcal</p>
    <button onclick="location.href='food.html'">食事を入力する</button>
  </div>

  <!-- 今日のやること -->
  <div class="card">
    <h2>今日のやること</h2>
    <ul id="todoListDashboard"></ul>
    <button onclick="location.href='todo.html'">ToDoを追加する</button>
  </div>

  <!-- 今日のスケジュール -->
  <div class="card">
    <h2>今日のスケジュール</h2>
    <ul id="planListDashboard"></ul>
    <button onclick="location.href='schedule.html'">予定を追加する</button>
  </div>

  <!-- ミニ体重グラフ -->
  <div class="card">
    <h2>体重グラフ</h2>
    <canvas id="miniChart"></canvas>
  </div>

</body>
</html>
