<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食事カロリー管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>食事カロリー管理</h1>

    <section class="card">
      <h2>食事を記録</h2>

      <label for="foodSelect">食品</label>
      <select id="foodSelect"></select>

      <label for="amount">食べた量(g)</label>
      <input type="number" id="amount" placeholder="例：150">

      <label for="mealType">食事タイプ</label>
      <select id="mealType">
        <option value="朝食">朝食</option>
        <option value="昼食">昼食</option>
        <option value="夕食">夕食</option>
        <option value="間食">間食</option>
      </select>

      <button onclick="addMeal()">記録する</button>
    </section>

    <section class="card">
      <h2>今日の合計</h2>
      <p>摂取カロリー：<span id="totalCalorie">0</span> kcal</p>
      <p>P：<span id="protein">0</span> g</p>
      <p>F：<span id="fat">0</span> g</p>
      <p>C：<span id="carbs">0</span> g</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
