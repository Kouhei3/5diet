<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>メール認証コードの入力</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* このページ固有のスタイルのみ */
        .container { text-align: center; }
        .email-highlight {
            font-weight: bold;
            color: var(--primary);
        }
        input[type="text"] {
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <div class="brand-badge">STEP 2</div>
        <h1>メールをご確認ください</h1>
        <p class="subtitle">
            ご入力いただいたメールアドレス<br>
            <span class="email-highlight" th:text="${email}">example@example.com</span><br>
            宛に認証コードを送信しました。
        </p>
    </div>

    <form action="/api/verify" method="POST">
        <input type="hidden" name="email" th:value="${email}" />
        <input type="hidden" name="username" th:value="${username}" />

        <div class="field-row">
            <input type="text" name="code" placeholder="6桁の認証コード" required maxlength="6" autocomplete="off">
        </div>
        <button type="submit" class="submit-button">認証する</button>
    </form>
</div>

</body>
</html>
