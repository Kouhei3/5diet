<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>アカウント新規登録 | 5DIET</title>

    <!-- ★ static 配下の CSS を読み込む -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div class="brand-header">
        <div class="brand-badge">5DIET</div>
        <h1>新規登録</h1>
        <p class="subtitle">アカウントを作成するために情報を入力してください。</p>
        <p id="message" class="message"></p>
    </div>

    <!-- ★ Controller に POST する -->
    <form id="registerForm" action="/api/register" method="post">
        <div class="field-row">
            <label for="username">ユーザー名</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
        </div>

        <div class="field-row">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field-row">
            <label for="password">パスワード</label>
            <div class="password-field">
                <input type="password" id="password" name="password" autocomplete="new-password" required>
                <button type="button" class="password-toggle" data-target="password">表示</button>
            </div>
        </div>

        <button type="submit" class="submit-button">新規登録する</button>
    </form>

    <div class="auth-links">
        <!-- ★ login.html ではなく /login に遷移させる -->
        <button type="button" class="button-outline" onclick="location.href='/login'">
            すでにアカウントをお持ちの方（ログイン）
        </button>
    </div>
</div>

<!-- ★ static 配下の JS を読み込む -->
<script src="/js/auth.js"></script>
</body>
</html>
