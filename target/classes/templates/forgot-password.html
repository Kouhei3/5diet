<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>パスワード再設定 | 5DIET</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="brand-header">
        <div class="brand-badge">5DIET</div>
        <h1>パスワード再設定</h1>
        <p class="subtitle">登録したユーザー名を入力してください。登録されているメールアドレス宛に再設定用の情報をお送りします。</p>
        <p id="message" class="message"></p>
    </div>

    <form id="forgotPasswordForm">
        <div class="field-row">
            <label for="username">ユーザー名</label>
            <input type="text" id="username" autocomplete="username" placeholder="登録したユーザー名" required>
        </div>

        <button type="submit" class="submit-button">送信する</button>
    </form>

    <div class="auth-links">
        <a href="/login" class="button-outline">ログイン画面に戻る</a>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
