<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>新しいパスワードの設定 | 5DIET</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="brand-header">
        <div class="brand-badge">5DIET</div>
        <h1>パスワード再設定</h1>
        <p class="subtitle">メールに届いた認証コードと、新しいパスワードを入力してください。</p>
        <p id="message" class="message"></p>
    </div>

    <form id="resetForm">
        <input type="hidden" id="hiddenUsername">

        <div class="field-row">
            <label for="code">認証コード</label>
            <input type="text" id="code" required>
        </div>

        <div class="field-row">
            <label for="newPassword">新しいパスワード</label>
            <div class="password-field">
                <input type="password" id="newPassword" required>
                <button type="button" class="password-toggle" data-target="newPassword">表示</button>
            </div>
        </div>

        <div class="field-row">
            <label for="confirmPassword">新しいパスワード（確認用）</label>
            <div class="password-field">
                <input type="password" id="confirmPassword" required>
                <button type="button" class="password-toggle" data-target="confirmPassword">表示</button>
            </div>
        </div>

        <button type="submit" class="submit-button">パスワードを変更する</button>
    </form>

    <div class="auth-links">
        <a href="/login" class="button-outline">ログイン画面に戻る</a>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
