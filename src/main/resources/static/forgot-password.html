<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワードをお忘れの方 - 5DIET</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <span class="brand-badge">5DIET</span>
            <h1>パスワード再設定</h1>
            <p class="subtitle">登録したメールアドレスを入力してください。<br>認証コードを送信します。</p>
        </div>
        
        <div id="message" class="message" style="display:none; padding: 10px; margin-bottom: 15px; border-radius: 4px;"></div>

        <form id="forgotPasswordForm">
            <div class="field-row">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" required placeholder="example@domain.com">
            </div>
            
            <button type="submit" class="submit-button">認証コードを送信する</button>
        </form>

        <div class="auth-links">
            <a href="/login.html" class="button-outline">ログイン画面に戻る</a>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msg = document.getElementById('message');
            const btn = document.querySelector('.submit-button');
            
            btn.innerText = '送信中...';
            btn.disabled = true;
            msg.style.display = 'none';
            
            fetch('/api/reset-password-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(async response => {
                if(response.ok) {
                    sessionStorage.setItem('resetEmail', email);
                    window.location.href = '/reset.html';
                } else {
                    // Java側から返ってきた具体的なエラーメッセージを表示する
                    const data = await response.json();
                    msg.innerText = data.message || 'エラーが発生しました。';
                    msg.style.backgroundColor = '#ffebee';
                    msg.style.color = '#c62828';
                    msg.style.display = 'block';
                    btn.innerText = '認証コードを送信する';
                    btn.disabled = false;
                }
            })
            .catch(error => {
                msg.innerText = '通信エラーが発生しました。サーバーが起動しているか確認してください。';
                msg.style.backgroundColor = '#ffebee';
                msg.style.color = '#c62828';
                msg.style.display = 'block';
                btn.innerText = '認証コードを送信する';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
