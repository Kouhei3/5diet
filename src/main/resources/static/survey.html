<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e4d2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>5DIET – はじめてのアンケート</title>
    <link rel="stylesheet" href="css/survey.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <!-- ヘッダー -->
      <header class="survey-header">
        <div class="logo-block">
          <span class="logo-num">5</span><span class="logo-text">DIET</span>
        </div>
        <p class="header-sub">
          あなたに合ったダイエットプランを作成するために<br />初回アンケートにご回答ください。
        </p>
      </header>

      <!-- ステップインジケーター -->
      <div class="step-indicator" id="stepIndicator">
        <span class="step-current" id="stepCurrentLabel">STEP 1 / 4</span>
      </div>

      <!-- プログレスバー -->
      <div class="progress-wrap" aria-label="進捗">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <!-- フォーム本体 -->
      <main class="survey-main">
        <form id="surveyForm" novalidate>
          <!-- ========== STEP 01: 基本情報 ========== -->
          <section class="card" data-section="1" data-questions="5">
            <div class="section-tag">STEP 01</div>
            <h2 class="section-title">基本情報</h2>

            <!-- 性別 -->
            <div class="field-group">
              <label class="field-label"
                >性別<span class="required">必須</span></label
              >
              <div class="gender-wrap">
                <label class="gender-card">
                  <input type="radio" name="gender" value="male" required />
                  <span class="gender-icon">♂</span>
                  <span class="gender-txt">男性</span>
                </label>
                <label class="gender-card">
                  <input type="radio" name="gender" value="female" />
                  <span class="gender-icon">♀</span>
                  <span class="gender-txt">女性</span>
                </label>
              </div>
              <p class="err-msg" id="err-gender"></p>
            </div>

            <!-- 年齢 -->
            <div class="field-group">
              <label class="field-label" for="age"
                >年齢<span class="required">必須</span></label
              >
              <div class="input-unit-wrap">
                <input
                  class="input-box"
                  type="number"
                  id="age"
                  name="age"
                  min="10"
                  max="100"
                  placeholder="例：25"
                  required
                />
                <span class="unit">歳</span>
              </div>
              <p class="err-msg" id="err-age"></p>
            </div>

            <!-- 身長 -->
            <div class="field-group">
              <label class="field-label" for="height"
                >身長<span class="required">必須</span></label
              >
              <div class="input-unit-wrap">
                <input
                  class="input-box"
                  type="number"
                  id="height"
                  name="height"
                  min="100"
                  max="250"
                  step="0.1"
                  placeholder="例：165.0"
                  required
                />
                <span class="unit">cm</span>
              </div>
              <p class="err-msg" id="err-height"></p>
            </div>

            <!-- 体重 -->
            <div class="field-group">
              <label class="field-label" for="weight"
                >体重<span class="required">必須</span></label
              >
              <div class="input-unit-wrap">
                <input
                  class="input-box"
                  type="number"
                  id="weight"
                  name="weight"
                  min="20"
                  max="300"
                  step="0.1"
                  placeholder="例：60.0"
                  required
                />
                <span class="unit">kg</span>
              </div>
              <p class="err-msg" id="err-weight"></p>
            </div>

            <!-- BMI 表示（体重入力欄の直下） -->
            <div class="bmi-display">
              <span class="bmi-label">現在のBMI</span>
              <span class="bmi-value" id="bmiValue">—</span>
              <span class="bmi-status" id="bmiStatus"></span>
            </div>

            <!-- 目標体重 -->
            <div class="field-group">
              <label class="field-label" for="goalWeight"
                >目標体重<span class="required">必須</span></label
              >
              <div class="input-unit-wrap">
                <input
                  class="input-box"
                  type="number"
                  id="goalWeight"
                  name="goalWeight"
                  min="20"
                  max="300"
                  step="0.1"
                  placeholder="例：55.0"
                  required
                />
                <span class="unit">kg</span>
              </div>
              <p class="err-msg" id="err-goalWeight"></p>
            </div>
          </section>

          <!-- ========== STEP 02: 目標設定 ========== -->
          <section class="card" data-section="2" data-questions="2">
            <div class="section-tag">STEP 02</div>
            <h2 class="section-title">目標設定</h2>

            <!-- 目標達成日 -->
            <div class="field-group">
              <label class="field-label" for="goalDate">
                目標達成日<span class="required">必須</span>
                <span class="days-badge" id="daysBadge"></span>
              </label>
              <input
                class="input-box date-input"
                type="date"
                id="goalDate"
                name="goalDate"
                required
              />
              <p class="err-msg" id="err-goalDate"></p>
            </div>

            <!-- ダイエットの目的 -->
            <div class="field-group">
              <label class="field-label" for="purpose"
                >ダイエットの目的<span class="required">必須</span></label
              >
              <select class="select-box" id="purpose" name="purpose" required>
                <option value="" disabled selected>選択してください。</option>
                <option value="健康維持・体力向上">健康維持・体力向上</option>
                <option value="見た目の改善（体型を整えたい）">
                  見た目の改善（体型を整えたい）
                </option>
                <option value="医師からの指示・健康上の理由">
                  医師からの指示・健康上の理由
                </option>
                <option value="スポーツ・競技のため">
                  スポーツ・競技のため
                </option>
                <option value="その他">その他</option>
              </select>
              <p class="err-msg" id="err-purpose"></p>
            </div>

            <!-- 「その他」詳細（条件表示） -->
            <div class="field-group hidden" id="purposeOtherWrap">
              <label class="field-label" for="purposeOther"
                >「その他」の詳細<span class="required">必須</span></label
              >
              <textarea
                class="textarea-box"
                id="purposeOther"
                name="purposeOther"
                rows="3"
                placeholder="目的の詳細を入力してください"
              ></textarea>
              <p class="err-msg" id="err-purposeOther"></p>
            </div>
          </section>

          <!-- ========== STEP 03: 生活スタイル ========== -->
          <section class="card" data-section="3" data-questions="2">
            <div class="section-tag">STEP 03</div>
            <h2 class="section-title">生活スタイル</h2>

            <!-- 活動レベル -->
            <div class="field-group">
              <label class="field-label" for="activityLevel"
                >活動レベル<span class="required">必須</span></label
              >
              <select
                class="select-box"
                id="activityLevel"
                name="activityLevel"
                required
              >
                <option value="" disabled selected>選択してください。</option>
                <option value="sedentary">
                  ほぼ運動しない（デスクワーク中心）
                </option>
                <option value="light">軽い運動（週1〜2回）</option>
                <option value="moderate">適度な運動（週3〜5回）</option>
                <option value="active">激しい運動（週6〜7回）</option>
                <option value="very_active">
                  アスリートレベル（毎日ハードトレーニング）
                </option>
              </select>
              <p class="err-msg" id="err-activityLevel"></p>
            </div>

            <!-- 仕事の種類 -->
            <div class="field-group">
              <label class="field-label" for="jobType"
                >仕事の種類<span class="required">必須</span></label
              >
              <select class="select-box" id="jobType" name="jobType" required>
                <option value="" disabled selected>選択してください。</option>
                <option value="desk">デスクワーク（座りっぱなしが多い）</option>
                <option value="standing">立ち仕事・接客業</option>
                <option value="physical">肉体労働・現場作業</option>
                <option value="mixed">混合（デスクワーク＋移動あり）</option>
                <option value="none">学生・専業主婦（主夫）・無職</option>
              </select>
              <p class="err-msg" id="err-jobType"></p>
            </div>
          </section>

          <!-- ========== STEP 04: 食事情報 ========== -->
          <section class="card" data-section="4" data-questions="2">
            <div class="section-tag">STEP 04</div>
            <h2 class="section-title">食事情報</h2>

            <!-- 食事管理経験 -->
            <div class="field-group">
              <label class="field-label" for="dietExp"
                >食事管理経験<span class="required">必須</span></label
              >
              <select class="select-box" id="dietExp" name="dietExp" required>
                <option value="" disabled selected>選択してください。</option>
                <option value="none">まったく経験なし</option>
                <option value="little">
                  少しある（カロリーを気にしたことがある程度）
                </option>
                <option value="moderate">
                  ある程度ある（食事記録をつけたことがある）
                </option>
                <option value="experienced">
                  経験豊富（PFCバランスなど管理したことがある）
                </option>
              </select>
              <p class="err-msg" id="err-dietExp"></p>
            </div>

            <!-- 食事スタイル -->
            <div class="field-group">
              <label class="field-label" for="mealStyle"
                >食事スタイル<span class="required">必須</span></label
              >
              <select
                class="select-box"
                id="mealStyle"
                name="mealStyle"
                required
              >
                <option value="" disabled selected>選択してください。</option>
                <option value="japanese">和食中心</option>
                <option value="western">洋食・外食中心</option>
                <option value="mixed">和洋混合</option>
                <option value="vegetarian">ベジタリアン・ヴィーガン</option>
                <option value="other">その他</option>
              </select>
              <p class="err-msg" id="err-mealStyle"></p>
            </div>

            <!-- アレルギー（任意） -->
            <div class="field-group">
              <label class="field-label" for="allergy">
                食物アレルギー
                <span class="optional-badge">任意</span>
              </label>
              <textarea
                class="textarea-box"
                id="allergy"
                name="allergy"
                rows="2"
                placeholder="例：卵、乳製品、小麦（なければ空欄で構いません）"
              ></textarea>
            </div>
          </section>

        </form>
      </main>

      <footer class="survey-footer">
        <p>© 2026 5DIET. All rights reserved.</p>
      </footer>
    </div>

    <!-- 下部固定ナビゲーションバー（戻る / 進捗 / 次へ・送信） -->
    <nav class="bottom-nav" id="bottomNav">
      <button type="button" class="btn-nav btn-prev" id="prevBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6" />
        </svg>
        <span>戻る</span>
      </button>

      <div class="nav-remaining" id="navRemaining">
        あと <span id="remainingCount">7</span> 問
      </div>

      <button type="button" class="btn-nav btn-next" id="nextBtn" form="surveyForm">
        <span>次へ</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>

      <button type="submit" class="btn-submit hidden" id="submitBtn" form="surveyForm">
        <span>送信する</span>
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </nav>
    <p class="submit-note hidden" id="submitNote">
      送信後にパーソナライズされたプランが作成されます
    </p>

    <script src="js/survey.js"></script>
  </body>
</html>
