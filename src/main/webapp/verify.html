<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>アカウント認証 | 5DIET</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="brand-header">
        <div class="brand-badge">5DIET</div>
        <h1>アカウント認証</h1>
        <p class="subtitle">登録したメールアドレス宛に認証コードを送信しました。メールをご確認のうえ、コードを入力して本登録を完了してください。</p>
        <p id="message" class="message"></p>
    </div>

    <form id="verifyForm">
        <div class="field-row">
            <label for="verificationCode">認証コード</label>
            <input type="text" id="verificationCode" placeholder="例: 123456" required>
        </div>

        <button type="submit" class="submit-button">本登録を完了する</button>
    </form>
</div>

<script src="js/auth.js"></script>
</body>
</html>
