<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#dfe8d8" />
    <title>新規登録</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="container">
      <div class="brand-header">
        <div class="brand-badge">5DIET</div>
        <h1>新規登録</h1>
        <p class="subtitle">あなたに寄り添うダイエットプランを始めましょう。</p>
        <p id="message" class="message"></p>
      </div>

      <form id="registerForm">
        <div class="field-row">
          <label for="username">ユーザー名</label>
          <input type="text" id="username" autocomplete="username" autocapitalize="none" required />
        </div>

        <div class="field-row">
          <label for="password">パスワード</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              data-target="password"
              aria-label="パスワードを表示"
              aria-pressed="false"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a16.6 16.6 0 0 1-3.1 4.1M6.7 6.7C4 8.5 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.1-.9"></path>
                <path d="M9.5 9.7a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="field-row">
          <label for="confirmPassword">パスワード確認</label>
          <div class="password-field">
            <input
              type="password"
              id="confirmPassword"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              data-target="confirmPassword"
              aria-label="パスワードを表示"
              aria-pressed="false"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a16.6 16.6 0 0 1-3.1 4.1M6.7 6.7C4 8.5 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.1-.9"></path>
                <path d="M9.5 9.7a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-button">登録する</button>
      </form>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
