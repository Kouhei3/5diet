<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>今日のやることリスト</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <h1>今日のやることリスト</h1>

  <div class="card">
    <label>やること</label>
    <input id="todoInput" type="text" placeholder="例：ジムに行く">

    <button id="addTodoBtn">追加</button>
  </div>

  <div class="result">
    <h2>今日のタスク</h2>
    <ul id="todoList"></ul>
  </div>

</body>
</html>
