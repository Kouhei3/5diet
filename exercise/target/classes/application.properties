# 1. AWS RDSへの接続URL（末尾の diet_app という部屋が自動で作られます）
spring.datasource.url=jdbc:mysql://database-1.c3uiu3zg691r.us-east-1.rds.amazonaws.com:3306/diet_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# 2. ユーザー名（デフォルトの admin のままでOK）
spring.datasource.username=admin

# 3. パスワード（あなたがAWS作成時に設定した、実際のマスターパスワード）
spring.datasource.password=pbl5hanaws

# 4. Hibernateの設定（Javaのクラスから自動でテーブルを作成・更新する機能）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ===================================================================
# AWS RDS (MySQL) 接続設定
# ===================================================================
# ※ [データベース名] の部分は、AWSで作った実際のデータベース名（workout_dbなど）に書き換えてください
spring.datasource.url=jdbc:mysql://database-1.c3uiu3zg691r.us-east-1.rds.amazonaws.com:3306/[データベース名]?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8

# 認証情報
spring.datasource.username=admin
spring.datasource.password=pbl5hanaws

# データベースのドライバー
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate（JPA）の設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect