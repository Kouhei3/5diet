<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>食事入力</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>食事入力</h1>

  <div class="card">
    <label>食品名</label>
    <input id="foodName" type="text" placeholder="例：鶏むね肉">

    <label>カロリー（kcal）</label>
    <input id="calorie" type="number" placeholder="200">

    <label>タンパク質（g）</label>
    <input id="protein" type="number" step="0.1" placeholder="20">

    <button id="saveFoodBtn">保存</button>
  </div>

  <div class="result">
    <h2>今日の食事（仮保存）</h2>
    <ul id="foodList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
